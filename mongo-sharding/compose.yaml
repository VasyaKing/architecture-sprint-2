    command: [
      "mongos",
      "--configdb",
      "configReplSet/config1:27017,config2:27017,config3:27017",
      "--bind_ip_all",
      "--port",
      "27020"
    ]

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 173.17.0.0/16

volumes:
  config1-data:
  config2-data:
  config3-data:
  shard1_1-data:
  shard1_2-data:
  shard1_3-data:
  shard2_1-data:
  shard2_2-data:
  shard2_3-data:

