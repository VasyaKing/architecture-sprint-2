services:
  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    image: kazhem/pymongo_api:1.0.0
    depends_on:
      - router1
      - router2
      - router3
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: mongodb://router1:27020
      MONGODB_DATABASE_NAME: "somedb"
    networks:
      - app-network

  config1:
    image: mongo:latest
    container_name: config1
    restart: always
    ports:
      - "27017:27017"
    networks:
      app-network:
        ipv4_address: 173.17.0.6
    volumes:
      - config1-data:/data/db
    command: [
      "mongod",
      "--configsvr",
      "--replSet",
      "configReplSet",
      "--bind_ip_all",
      "--port",
      "27017"
    ]

  config2:
    image: mongo:latest
    container_name: config2
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.7
    volumes:
      - config2-data:/data/db
    command: [
      "mongod",
      "--configsvr",
      "--replSet",
      "configReplSet",
      "--bind_ip_all",
      "--port",
      "27017"
    ]

  config3:
    image: mongo:latest
    container_name: config3
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.8
    volumes:
      - config3-data:/data/db
    command: [
      "mongod",
      "--configsvr",
      "--replSet",
      "configReplSet",
      "--bind_ip_all",
      "--port",
      "27017"
    ]

  shard1_1:
    image: mongo:latest
    container_name: shard1_1
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.9
    volumes:
      - shard1_1-data:/data/db
    command: [
      "mongod",
      "--shardsvr",
      "--replSet",
      "shard1ReplSet",
      "--bind_ip_all",
      "--port",
      "27018"
    ]

  shard1_2:
    image: mongo:latest
    container_name: shard1_2
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.10
    volumes:
      - shard1_2-data:/data/db
    command: [
      "mongod",
      "--shardsvr",
      "--replSet",
      "shard1ReplSet",
      "--bind_ip_all",
      "--port",
      "27018"
    ]

  shard1_3:
    image: mongo:latest
    container_name: shard1_3
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.11
    volumes:
      - shard1_3-data:/data/db
    command: [
      "mongod",
      "--shardsvr",
      "--replSet",
      "shard1ReplSet",
      "--bind_ip_all",
      "--port",
      "27018"
    ]

  shard2_1:
    image: mongo:latest
    container_name: shard2_1
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.12
    volumes:
      - shard2_1-data:/data/db
    command: [
      "mongod",
      "--shardsvr",
      "--replSet",
      "shard2ReplSet",
      "--bind_ip_all",
