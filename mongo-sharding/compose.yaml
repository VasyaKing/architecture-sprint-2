    ]

  router1:
    image: mongo:latest
    container_name: router1
    restart: always
    ports:
      - "27020:27020"
    networks:
      app-network:
        ipv4_address: 173.17.0.15
    command: [
      "mongos",
      "--configdb",
      "configReplSet/config1:27017,config2:27017,config3:27017",
      "--bind_ip_all",
      "--port",
      "27020"
    ]

  router2:
    image: mongo:latest
